name: KYC policy audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: kyc-policy-audit-main
  cancel-in-progress: false

jobs:
  audit:
    name: Audit open PR policies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-kyc-presentation.ts --audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
